get_hourly_usage:
  fields:
    date:
      required: true
      example: "2026-06-07"
      selector:
        date:
    config_entry_id:
      required: false
      example: "abc123"
      selector:
        config_entry:
          integration: powershop_nz


backfill_energy_statistics:
  fields:
    days:
      required: false
      default: 60
      example: 60
      selector:
        number:
          min: 1
          max: 365
          mode: box
    config_entry_id:
      required: false
      example: "abc123"
      selector:
        config_entry:
          integration: powershop_nz
